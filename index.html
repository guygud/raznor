<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Беларусь 2026</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --gold: #f0b429;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --text: #e8eaf0;
      --text2: #8b93b0;
      --r: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1d27, #1e2540);
      border-bottom: 1px solid var(--border);
      padding: 18px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .header-top h1 { font-size: 18px; font-weight: 700; }
    .header-top p  { font-size: 12px; color: var(--text2); margin-top: 2px; }

    /* Route strip */
    .route-strip {
      display: flex; align-items: center;
      overflow-x: auto; scrollbar-width: none;
      padding-bottom: 12px;
    }
    .route-strip::-webkit-scrollbar { display: none; }
    .route-city { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .route-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .route-dot.end { background: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); }
    .route-name { font-size: 10px; font-weight: 600; color: var(--text2); margin-top: 4px; white-space: nowrap; }
    .route-line {
      flex: 1; min-width: 20px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin-bottom: 16px; flex-shrink: 0;
    }

    /* Tabs */
    .tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 7px 13px;
      cursor: pointer; color: var(--text2);
      font-size: 13px; font-weight: 500;
      transition: all .2s; white-space: nowrap;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tab.info.active { background: var(--accent2); border-color: var(--accent2); }

    /* ── Panels ── */
    main { padding: 14px 16px 40px; max-width: 640px; margin: 0 auto; }
    .panel { display: none; animation: up .22s ease; }
    .panel.active { display: block; }
    @keyframes up { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; } }

    /* Day header card */
    .day-head {
      background: linear-gradient(135deg, var(--surface), var(--surface2));
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 15px; margin-bottom: 12px;
    }
    .day-head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .day-badge {
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 3px 9px; border-radius: 20px;
      letter-spacing: .5px; white-space: nowrap;
    }
    .day-date  { font-size: 16px; font-weight: 700; }
    .day-city  { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .day-theme { font-size: 12px; color: var(--text2); font-style: italic; margin-top: 3px; }
    .transport {
      display: flex; gap: 8px; align-items: flex-start;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px;
      margin-top: 10px; font-size: 13px; color: var(--text2);
    }
    .transport + .transport { margin-top: 6px; }

    /* Warning */
    .warn-box {
      background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.35);
      border-radius: var(--r); padding: 11px 13px;
      margin-bottom: 12px; font-size: 13px; color: #fbb56a;
    }
    .warn-box ul { padding-left: 16px; }
    .warn-box li { margin-top: 3px; }

    /* Section title */
    .sec { font-size: 12px; font-weight: 700; color: var(--text2);
           text-transform: uppercase; letter-spacing: .8px;
           margin: 16px 0 9px; }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); margin-bottom: 9px; overflow: hidden;
      transition: border-color .18s;
    }
    .card:hover { border-color: #3a4165; }
    .card-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 13px 10px; gap: 10px;
      cursor: pointer; user-select: none;
    }
    .card-name { font-weight: 600; font-size: 14px; }
    .card-sub  { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .badges { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .badge {
      font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 6px; white-space: nowrap;
    }
    .b-must   { background: rgba(240,180,41,.18); color: var(--gold);  border: 1px solid rgba(240,180,41,.35); }
    .b-free   { background: rgba(34,197,94,.13);  color: var(--green); border: 1px solid rgba(34,197,94,.28); }
    .b-price  { background: rgba(79,142,247,.13); color: #8ab4f8;      border: 1px solid rgba(79,142,247,.28); }
    .b-bfast  { background: rgba(250,204,21,.13); color: #fcd34d;      border: 1px solid rgba(250,204,21,.28); }
    .b-book   { background: rgba(124,92,191,.16); color: #b08af0;      border: 1px solid rgba(124,92,191,.32); }
    .b-closed { background: rgba(239,68,68,.13);  color: #fca5a5;      border: 1px solid rgba(239,68,68,.3);   }
    .chevron  { color: var(--text2); font-size: 13px; transition: transform .18s; flex-shrink: 0; }
    .card.open .chevron { transform: rotate(180deg); }

    .card-body {
      display: none; padding: 0 13px 12px;
      border-top: 1px solid var(--border);
    }
    .card.open .card-body { display: block; }
    .card-desc { font-size: 13px; color: #aab0cc; margin-top: 10px; line-height: 1.55; }

    .meta { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
    .meta-row { display: flex; gap: 8px; font-size: 12px; color: var(--text2); align-items: flex-start; }
    .meta-row .ic { width: 16px; text-align: center; flex-shrink: 0; }
    .meta-row a { color: var(--accent); text-decoration: none; }
    .meta-row a:hover { text-decoration: underline; }

    .rating { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--gold); }

    /* Maps button */
    .maps-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(79,142,247,.13); border: 1px solid rgba(79,142,247,.3);
      color: #8ab4f8; border-radius: 8px;
      padding: 5px 11px; font-size: 12px; font-weight: 600;
      text-decoration: none; margin-top: 10px;
      transition: background .18s;
    }
    .maps-btn:hover { background: rgba(79,142,247,.22); }

    /* Practical tab */
    .info-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 15px; margin-bottom: 11px;
    }
    .info-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
    .info-row {
      display: flex; gap: 10px; font-size: 13px; color: var(--text2);
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row .lbl { font-weight: 600; color: var(--text); min-width: 110px; flex-shrink: 0; }
    .warn-li {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 13px; color: #fbb56a;
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .warn-li:last-child { border-bottom: none; }
    .note-li {
      display: flex; gap: 9px; font-size: 13px; color: var(--text2);
      padding: 5px 0;
    }
    .note-li::before { content: '•'; color: var(--accent); font-size: 18px; line-height: 1; flex-shrink: 0; }

    /* Loading */
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 60vh; font-size: 15px; color: var(--text2);
    }

    footer { text-align: center; padding: 10px 16px 30px; color: var(--text2); font-size: 12px; }
  </style>
</head>
<body>

<div id="app">
  <div class="loading">Загрузка…</div>
</div>

<script>
const DAY_EMOJIS = ['🏙️','🏰','🏛️','⛪'];
const CITY_EMOJIS = { 'Минск':'🏙️', 'Несвиж + Мирский замок':'🏰', 'Брест':'🏛️', 'Гродно':'⛪' };

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function badge(cls, text) {
  return `<span class="badge ${cls}">${text}</span>`;
}

function priceBadge(price) {
  if (!price) return '';
  const p = price.toLowerCase();
  if (p === 'бесплатно') return badge('b-free', 'бесплатно');
  return badge('b-price', esc(price));
}

function renderMeta(rows) {
  return `<div class="meta">${rows.filter(Boolean).join('')}</div>`;
}

function metaRow(icon, content) {
  if (!content) return '';
  return `<div class="meta-row"><span class="ic">${icon}</span><span>${content}</span></div>`;
}

function mapsBtn(geo) {
  if (!geo) return '';
  const google = `https://maps.google.com/?q=${geo.lat},${geo.lng}`;
  const yandex = `https://yandex.ru/maps/?pt=${geo.lng},${geo.lat}&z=17`;
  return `<div style="display:flex;gap:7px;margin-top:10px">
    <a class="maps-btn" href="${google}" target="_blank">🗺️ Google</a>
    <a class="maps-btn" href="${yandex}" target="_blank">🗺️ Яндекс</a>
  </div>`;
}

function renderWarnings(warnings) {
  if (!warnings?.length) return '';
  return `<div class="warn-box"><ul>${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
}

function renderSight(s) {
  const isFree = (s.price ?? '').toLowerCase() === 'бесплатно';
  return `
  <div class="card" onclick="toggle(this)">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(s.name)}</div>
        <div class="card-sub">${esc(s.type)}</div>
      </div>
      <div class="badges">
        ${s.must_see ? badge('b-must','⭐ маст-си') : ''}
        ${s.warning ? badge('b-closed','⚠️ закрыто') : ''}
        ${priceBadge(s.price)}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-desc">${esc(s.description)}</div>
      ${renderMeta([
        metaRow('🕐', s.hours),
        metaRow('📍', s.address),
        metaRow('💰', s.price),
        s.booking_tip ? metaRow('💡', s.booking_tip) : '',
        s.warning    ? `<div class="meta-row"><span class="ic">⚠️</span><span style="color:#fca5a5">${esc(s.warning)}</span></div>` : '',
        s.url        ? metaRow('🔗', `<a href="${esc(s.url)}" target="_blank">${esc(s.url.replace(/https?:\/\//,''))}</a>`) : '',
      ])}
      ${mapsBtn(s.geo)}
    </div>
  </div>`;
}

function renderRestaurant(r) {
  const ratingHtml = r.rating ? `<div class="rating">★ ${r.rating}</div>` : '';
  return `
  <div class="card" onclick="toggle(this)">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-sub">${esc(r.type)}</div>
      </div>
      <div class="badges">
        ${r.is_breakfast ? badge('b-bfast','☀️ завтрак') : ''}
        ${r.booking ? badge('b-book','📋 бронь') : ''}
        ${ratingHtml}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-desc">${esc(r.description)}</div>
      ${renderMeta([
        metaRow('🕐', r.hours),
        metaRow('📍', r.address),
        metaRow('💰', r.price_range),
        r.url ? metaRow('🔗', `<a href="${esc(r.url)}" target="_blank">${esc(r.url.replace(/https?:\/\//,''))}</a>`) : '',
      ])}
      ${mapsBtn(r.geo)}
    </div>
  </div>`;
}

function renderDay(day, idx) {
  const emoji = DAY_EMOJIS[idx] ?? '📍';
  const transportLines = [
    day.transport_in  ? `<div class="transport"><span>🚆</span><span>${esc(day.transport_in)}</span></div>` : '',
    day.transport_out ? `<div class="transport"><span>🏠</span><span>${esc(day.transport_out)}</span></div>` : '',
    day.transport_tip ? `<div class="transport"><span>💡</span><span>${esc(day.transport_tip)}</span></div>` : '',
  ].filter(Boolean).join('');

  return `
  <div class="day-head">
    <div class="day-head-row">
      <div>
        <div class="day-date">${esc(day.date)}</div>
        <div class="day-city">${emoji} ${esc(day.city)}</div>
        <div class="day-theme">${esc(day.theme)}</div>
      </div>
      <div class="day-badge">ДЕНЬ ${day.day}</div>
    </div>
    ${transportLines}
  </div>
  ${renderWarnings(day.day_warnings)}
  <div class="sec">⭐ Достопримечательности</div>
  ${(day.sights ?? []).map(renderSight).join('')}
  <div class="sec">🍽️ Рестораны и кафе</div>
  ${(day.restaurants ?? []).map(renderRestaurant).join('')}`;
}

function renderPractical(data) {
  const p = data.practical;
  const t = p.transport;
  const calRows = Object.entries(p.calendar ?? {}).map(([k, v]) => {
    const date = k.replace('_may', ' мая').replace('_', ' ');
    return `<div class="info-row"><span class="lbl">${date.trim()}</span><span>${esc(v)}</span></div>`;
  }).join('');

  return `
  <div class="info-card">
    <h3>💳 Деньги</h3>
    <div class="info-row"><span class="lbl">Валюта</span><span>${esc(p.currency)}</span></div>
    <div class="info-row"><span class="lbl">Карты</span><span>${esc(p.currency_note)}</span></div>
  </div>
  <div class="info-card">
    <h3>🚆 Транспорт</h3>
    <div class="info-row"><span class="lbl">Минск → Брест</span><span>${esc(t.minsk_to_brest)} (<a href="https://rw.by" target="_blank" style="color:var(--accent)">rw.by</a>)</span></div>
    <div class="info-row"><span class="lbl">Брест → Гродно</span><span>${esc(t.brest_to_grodno)}</span></div>
    <div class="info-row"><span class="lbl">Гродно → Москва</span><span>${esc(t.grodno_to_moscow)}</span></div>
  </div>
  <div class="info-card">
    <h3>⚠️ Важные предупреждения</h3>
    ${(p.warnings ?? []).map(w => `<div class="warn-li"><span>⚠️</span><span>${esc(w)}</span></div>`).join('')}
  </div>
  <div class="info-card">
    <h3>📅 Даты</h3>
    ${calRows}
  </div>
  <div class="info-card">
    <h3>📝 Заметки</h3>
    ${(data.trip.notes ?? []).map(n => `<div class="note-li">${esc(n)}</div>`).join('')}
  </div>`;
}

function renderRoute(days) {
  const cities = days.map(d => d.city.split(' + ')[0].split(' ')[0]);
  return cities.map((c, i) => `
    <div class="route-city">
      <div class="route-dot"></div>
      <div class="route-name">${esc(c)}</div>
    </div>
    ${i < cities.length - 1 ? '<div class="route-line"></div>' : '<div class="route-line"></div>'}
  `).join('') + `
  <div class="route-city">
    <div class="route-dot end"></div>
    <div class="route-name">🏠 Москва</div>
  </div>`;
}

function buildTabs(days) {
  return days.map((d, i) => {
    const cityShort = d.city.split(' ')[0];
    const dateShort = d.date.split(',')[0];
    return `<button class="tab${i===0?' active':''}" onclick="showPanel('day${i}', this)">${dateShort} · ${cityShort}</button>`;
  }).join('') + `<button class="tab info" onclick="showPanel('info', this)">ℹ️ Инфо</button>`;
}

function render(data) {
  const days = data.days;

  const panels = days.map((d, i) => `
    <div id="day${i}" class="panel${i===0?' active':''}">
      ${renderDay(d, i)}
    </div>
  `).join('') + `
  <div id="info" class="panel">
    ${renderPractical(data)}
  </div>`;

  document.getElementById('app').innerHTML = `
  <header class="header">
    <div class="header-top">
      <span style="font-size:28px">🇧🇾</span>
      <div>
        <h1>${esc(data.trip.title)}</h1>
        <p>${esc(data.trip.description)}</p>
      </div>
    </div>
    <div class="route-strip">${renderRoute(days)}</div>
    <div class="tabs">${buildTabs(days)}</div>
  </header>
  <main>${panels}</main>
  <footer>${esc(data.trip.dates)}</footer>`;
}

function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggle(card) {
  card.classList.toggle('open');
}

fetch('data.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('app').innerHTML =
      `<div class="loading" style="flex-direction:column;gap:8px">
        <span style="font-size:32px">⚠️</span>
        <span>Не удалось загрузить data.json</span>
        <span style="font-size:12px;color:var(--text2)">${esc(e.message)}</span>
      </div>`;
  });
</script>
</body>
</html>
