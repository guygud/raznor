<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Беларусь 2026</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1d27" />
  <style>
    /* ── Themes ── */
    :root, [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3350;
      --accent: #4f8ef7;
      --accent2: #7c5cbf;
      --gold: #f0b429;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --text: #e8eaf0;
      --text2: #8b93b0;
      --r: 14px;
      --header-bg: linear-gradient(135deg, #1a1d27, #1e2540);
      --visited-opacity: 0.38;
    }
    [data-theme="light"] {
      --bg: #f0f2f8;
      --surface: #ffffff;
      --surface2: #e8eaf4;
      --border: #d0d4e8;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --gold: #d97706;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #ea580c;
      --text: #1a1d2e;
      --text2: #5a6080;
      --r: 14px;
      --header-bg: linear-gradient(135deg, #ffffff, #eef0fa);
      --visited-opacity: 0.32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      transition: background .25s, color .25s;
    }

    /* ── Header ── */
    .header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 10px;
    }
    .header-top h1 { font-size: 17px; font-weight: 700; flex: 1; }
    .header-top p  { font-size: 11px; color: var(--text2); margin-top: 1px; }
    .theme-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 9px; cursor: pointer;
      font-size: 15px; line-height: 1; flex-shrink: 0;
      transition: background .2s;
    }
    .theme-btn:hover { background: var(--border); }

    /* Route strip */
    .route-strip {
      display: flex; align-items: center;
      overflow-x: auto; scrollbar-width: none;
      padding-bottom: 10px;
    }
    .route-strip::-webkit-scrollbar { display: none; }
    .route-city { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .route-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .route-dot.end { background: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); }
    .route-name { font-size: 10px; font-weight: 600; color: var(--text2); margin-top: 4px; white-space: nowrap; }
    .route-line {
      flex: 1; min-width: 20px; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin-bottom: 16px; flex-shrink: 0;
    }

    /* Tabs */
    .tabs { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 7px 13px;
      cursor: pointer; color: var(--text2);
      font-size: 13px; font-weight: 500;
      transition: all .2s; white-space: nowrap;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .tab.info.active { background: var(--accent2); border-color: var(--accent2); }
    .tab.today-tab { border-color: var(--green); }
    .tab.today-tab.active { background: var(--green); border-color: var(--green); }

    /* ── Panels ── */
    main { padding: 14px 16px 40px; max-width: 640px; margin: 0 auto; }
    .panel { display: none; animation: up .22s ease; }
    .panel.active { display: block; }
    @keyframes up { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; } }

    /* Day header */
    .day-head {
      background: var(--header-bg);
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 15px; margin-bottom: 12px;
    }
    .day-head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .day-badge {
      background: var(--accent); color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 3px 9px; border-radius: 20px;
      letter-spacing: .5px; white-space: nowrap;
    }
    .day-badge.today { background: var(--green); }
    .day-date  { font-size: 16px; font-weight: 700; }
    .day-city  { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 2px; }
    .day-theme { font-size: 12px; color: var(--text2); font-style: italic; margin-top: 3px; }
    .transport {
      display: flex; gap: 8px; align-items: flex-start;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px;
      margin-top: 8px; font-size: 13px; color: var(--text2);
    }

    /* Warning */
    .warn-box {
      background: rgba(249,115,22,.1); border: 1px solid rgba(249,115,22,.35);
      border-radius: var(--r); padding: 11px 13px;
      margin-bottom: 12px; font-size: 13px; color: #fbb56a;
    }
    .warn-box ul { padding-left: 16px; }
    .warn-box li { margin-top: 3px; }
    .warn-box a { color: #fdd09a; }

    /* Section + filter row */
    .sec { font-size: 12px; font-weight: 700; color: var(--text2);
           text-transform: uppercase; letter-spacing: .8px;
           margin: 16px 0 9px; }
    .filter-row { display: flex; gap: 6px; margin-bottom: 10px; }
    .filter-btn {
      background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 5px 12px;
      font-size: 12px; font-weight: 600; color: var(--text2);
      cursor: pointer; transition: all .18s;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Cards */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); margin-bottom: 9px; overflow: hidden;
      transition: border-color .18s, opacity .25s;
    }
    .card:hover { border-color: var(--accent2); }
    .card.hidden { display: none; }
    .card.visited { opacity: var(--visited-opacity); }
    .card.visited .card-name { text-decoration: line-through; }
    .card-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 12px 13px 10px; gap: 10px;
      cursor: pointer; user-select: none;
    }
    .card-name { font-weight: 600; font-size: 14px; }
    .card-sub  { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .badges { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .badge {
      font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 6px; white-space: nowrap;
    }
    .b-must   { background: rgba(240,180,41,.18); color: var(--gold);  border: 1px solid rgba(240,180,41,.35); }
    .b-free   { background: rgba(34,197,94,.13);  color: var(--green); border: 1px solid rgba(34,197,94,.28); }
    .b-price  { background: rgba(79,142,247,.13); color: #8ab4f8;      border: 1px solid rgba(79,142,247,.28); }
    .b-bfast  { background: rgba(250,204,21,.13); color: #fcd34d;      border: 1px solid rgba(250,204,21,.28); }
    .b-book   { background: rgba(124,92,191,.16); color: #b08af0;      border: 1px solid rgba(124,92,191,.32); }
    .b-closed { background: rgba(239,68,68,.13);  color: #fca5a5;      border: 1px solid rgba(239,68,68,.3);   }
    .b-open   { background: rgba(34,197,94,.15);  color: #4ade80;      border: 1px solid rgba(34,197,94,.35);  }
    .b-shut   { background: rgba(239,68,68,.13);  color: #fca5a5;      border: 1px solid rgba(239,68,68,.3);   }
    .chevron  { color: var(--text2); font-size: 13px; transition: transform .18s; flex-shrink: 0; }
    .card.open .chevron { transform: rotate(180deg); }

    .card-body {
      display: none; padding: 0 13px 12px;
      border-top: 1px solid var(--border);
    }
    .card.open .card-body { display: block; }
    .card-desc { font-size: 13px; color: var(--text2); margin-top: 10px; line-height: 1.55; opacity: .85; }

    .meta { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
    .meta-row { display: flex; gap: 8px; font-size: 12px; color: var(--text2); align-items: flex-start; }
    .meta-row .ic { width: 16px; text-align: center; flex-shrink: 0; }
    .meta-row a { color: var(--accent); text-decoration: none; }
    .meta-row a:hover { text-decoration: underline; }

    .rating { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--gold); }

    /* Maps buttons */
    .maps-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(79,142,247,.1); border: 1px solid rgba(79,142,247,.28);
      color: var(--accent); border-radius: 8px;
      padding: 5px 11px; font-size: 12px; font-weight: 600;
      text-decoration: none; transition: background .18s;
    }
    .maps-btn:hover { background: rgba(79,142,247,.2); }

    /* Visited hint */
    .visited-hint {
      font-size: 10px; color: var(--text2); text-align: center;
      margin-top: 4px; opacity: .5;
    }

    /* Practical tab */
    .info-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 15px; margin-bottom: 11px;
    }
    .info-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
    .info-row {
      display: flex; gap: 10px; font-size: 13px; color: var(--text2);
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row .lbl { font-weight: 600; color: var(--text); min-width: 110px; flex-shrink: 0; }
    .info-row a { color: var(--accent); text-decoration: none; }
    .warn-li {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 13px; color: #fbb56a;
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .warn-li:last-child { border-bottom: none; }
    .warn-li a { color: #fdd09a; }
    .note-li {
      display: flex; gap: 9px; font-size: 13px; color: var(--text2);
      padding: 5px 0;
    }
    .note-li::before { content: '•'; color: var(--accent); font-size: 18px; line-height: 1; flex-shrink: 0; }

    /* Story section */
    .story-toggle {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; padding: 9px 11px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 600; color: var(--text2);
      transition: border-color .18s, color .18s;
    }
    .story-toggle:hover { border-color: var(--accent2); color: var(--text); }
    .story-toggle .schevron { font-size: 12px; transition: transform .18s; }
    .story-toggle.open .schevron { transform: rotate(180deg); }
    .story-body { display: none; margin-top: 10px; }
    .story-body.open { display: block; }
    .story-hook {
      font-size: 14px; font-style: italic; font-weight: 600;
      color: var(--accent2); line-height: 1.5;
      padding: 10px 12px; margin-bottom: 12px;
      background: rgba(124,92,191,.08); border-left: 3px solid var(--accent2);
      border-radius: 0 8px 8px 0;
    }
    .story-section-title {
      font-size: 11px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: .7px;
      margin: 12px 0 6px;
    }
    .story-text { font-size: 13px; color: var(--text2); line-height: 1.65; }
    .story-list {
      padding-left: 0; list-style: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .story-list li {
      font-size: 13px; color: var(--text2); line-height: 1.55;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .story-list li::before { content: '•'; color: var(--accent2); font-size: 16px; line-height: 1; flex-shrink: 0; }
    .story-tips li::before { content: '💡'; font-size: 13px; }

    /* Loading */
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 60vh; font-size: 15px; color: var(--text2);
    }
    footer { text-align: center; padding: 10px 16px 30px; color: var(--text2); font-size: 12px; }

    /* Schedule timeline */
    .timeline { margin-top: 4px; display: flex; flex-direction: column; }
    .tl-item { display: flex; gap: 12px; align-items: flex-start; }
    .tl-left { display: flex; flex-direction: column; align-items: center; width: 56px; flex-shrink: 0; }
    .tl-time { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 4px 0 0; flex-shrink: 0; }
    .tl-line { width: 2px; flex: 1; background: var(--border); min-height: 14px; }
    .tl-item:last-child .tl-line { display: none; }
    .tl-event { font-size: 13px; color: var(--text2); padding: 2px 0 14px; }
  </style>
</head>
<body>

<div id="app">
  <div class="loading">Загрузка…</div>
</div>

<script>
/* ═══════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════ */
(function () {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
})();

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-icon').textContent = next === 'dark' ? '☀️' : '🌙';
}

/* ═══════════════════════════════════════════════
   VISITED STATE
═══════════════════════════════════════════════ */
const visited = new Set(JSON.parse(localStorage.getItem('visited') || '[]'));

function saveVisited() {
  localStorage.setItem('visited', JSON.stringify([...visited]));
}

function toggleVisited(card) {
  const id = card.dataset.vid;
  if (!id) return;
  if (visited.has(id)) {
    visited.delete(id);
    card.classList.remove('visited');
  } else {
    visited.add(id);
    card.classList.add('visited');
  }
  saveVisited();
}

/* Double-tap detection */
const lastTap = {};
function handleCardTap(e, card) {
  const id = card.dataset.vid;
  const now = Date.now();
  if (lastTap[id] && now - lastTap[id] < 350) {
    e.preventDefault();
    toggleVisited(card);
    lastTap[id] = 0;
  } else {
    lastTap[id] = now;
  }
}

/* ═══════════════════════════════════════════════
   STORIES MAP
═══════════════════════════════════════════════ */
let storiesMap = {};

function geoKey(geo) {
  if (!geo) return '';
  return `${geo.lat},${geo.lng}`;
}

function renderStorySection(s) {
  const facts = (s.did_you_know ?? []).map(f => `<li>${esc(f)}</li>`).join('');
  const tips  = (s.insider_tips  ?? []).map(t => `<li>${esc(t)}</li>`).join('');
  return `
  <div class="story-toggle" onclick="toggleStory(this); event.stopPropagation()">
    <span>📖 История и факты</span>
    <span class="schevron">▾</span>
  </div>
  <div class="story-body">
    ${s.hook ? `<div class="story-hook">${esc(s.hook)}</div>` : ''}
    ${s.story ? `<div class="story-section-title">История</div><div class="story-text">${esc(s.story)}</div>` : ''}
    ${facts ? `<div class="story-section-title">Знал ли ты?</div><ul class="story-list">${facts}</ul>` : ''}
    ${tips  ? `<div class="story-section-title">Советы гида</div><ul class="story-list story-tips">${tips}</ul>` : ''}
  </div>`;
}

function toggleStory(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

/* ═══════════════════════════════════════════════
   OPEN NOW
═══════════════════════════════════════════════ */
const RU_DAYS = { 'пн': 1, 'вт': 2, 'ср': 3, 'чт': 4, 'пт': 5, 'сб': 6, 'вс': 0 };

function parseTime(s) {
  const m = s.trim().match(/(\d{1,2}):(\d{2})/);
  return m ? parseInt(m[1]) * 60 + parseInt(m[2]) : null;
}

function expandDayRange(from, to) {
  // expand e.g. пн–пт → [1,2,3,4,5]
  const days = [1,2,3,4,5,6,0];
  const fi = days.indexOf(RU_DAYS[from]);
  const ti = days.indexOf(RU_DAYS[to]);
  if (fi === -1 || ti === -1) return null;
  if (fi <= ti) return days.slice(fi, ti + 1);
  return [...days.slice(fi), ...days.slice(0, ti + 1)];
}

function isOpenNow(hours) {
  if (!hours) return null;
  const h = hours.toLowerCase().trim();

  if (h.includes('круглосуточно')) return true;

  const now = new Date();
  const todayMin = now.getHours() * 60 + now.getMinutes();
  const todayDow = now.getDay(); // 0=Sun

  // Check "выходной — X" or "выходной — X, Y"
  const closedMatch = h.match(/выходной[^:]*[—-]\s*(.+)/);
  if (closedMatch) {
    const closedDays = closedMatch[1].split(/[,\s]+/).map(d => d.trim().slice(0,2)).filter(d => RU_DAYS[d] !== undefined);
    if (closedDays.some(d => RU_DAYS[d] === todayDow)) return false;
  }

  // Split by comma to handle "пн–пт X–Y, сб–вс X–Y"
  const segments = h.split(/,\s*/);
  for (const seg of segments) {
    // Match: [dayrange] HH:MM–HH:MM
    const m = seg.match(/(?:([а-я]{2})(?:[–-]([а-я]{2}))?\s+)?(\d{1,2}:\d{2})[–-](\d{1,2}:\d{2})/);
    if (!m) continue;

    const [, d1, d2, tFrom, tTo] = m;
    const open = parseTime(tFrom);
    let close = parseTime(tTo);
    if (open === null || close === null) continue;

    // Handle midnight crossover (e.g., 12:00–02:00)
    if (close < open) close += 24 * 60;

    // Check day applicability
    if (d1) {
      const allowedDays = d2 ? expandDayRange(d1, d2) : [RU_DAYS[d1]];
      if (!allowedDays || !allowedDays.includes(todayDow)) continue;
    }

    const effectiveNow = (close < open && todayMin < open) ? todayMin + 24 * 60 : todayMin;
    if (effectiveNow >= open && effectiveNow < close) return true;
  }

  // If we had time segments but none matched → closed
  if (h.match(/\d{1,2}:\d{2}/)) return false;
  return null; // unknown
}

/* ═══════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════ */
const DAY_EMOJIS = ['🌿', '🏰', '🏛️', '🏙️'];

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function linkifyPhones(text) {
  // Match Belarusian/RU phone numbers
  return esc(text).replace(/(\+375[\s\d()–-]{9,20})/g, m => {
    const digits = m.replace(/\D/g, '');
    return `<a href="tel:+${digits}">${m}</a>`;
  });
}

function badge(cls, text) {
  return `<span class="badge ${cls}">${text}</span>`;
}

function priceBadge(price) {
  if (!price) return '';
  return price.toLowerCase() === 'бесплатно' ? badge('b-free', 'бесплатно') : badge('b-price', esc(price));
}

function openBadge(hours) {
  const state = isOpenNow(hours);
  if (state === true)  return badge('b-open', '● открыто');
  if (state === false) return badge('b-shut', '● закрыто');
  return '';
}

function renderMeta(rows) {
  return `<div class="meta">${rows.filter(Boolean).join('')}</div>`;
}

function metaRow(icon, content) {
  if (!content) return '';
  return `<div class="meta-row"><span class="ic">${icon}</span><span>${content}</span></div>`;
}

function mapsBtn(geo) {
  if (!geo) return '';
  const google = `https://maps.google.com/?q=${geo.lat},${geo.lng}`;
  const yandex = `https://yandex.ru/maps/?pt=${geo.lng},${geo.lat}&z=17`;
  return `<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">
    <a class="maps-btn" href="${google}" target="_blank">🗺️ Google</a>
    <a class="maps-btn" href="${yandex}" target="_blank">🗺️ Яндекс</a>
  </div>`;
}

function renderWarnings(warnings) {
  if (!warnings?.length) return '';
  const items = warnings.map(w => `<li>${linkifyPhones(w)}</li>`).join('');
  return `<div class="warn-box"><ul>${items}</ul></div>`;
}

/* ═══════════════════════════════════════════════
   SIGHT CARD
═══════════════════════════════════════════════ */
function renderSight(s, dayIdx) {
  const vid = `s-${dayIdx}-${s.name}`;
  const isV = visited.has(vid);
  const story = storiesMap[geoKey(s.geo)];
  return `
  <div class="card${isV ? ' visited' : ''}" data-vid="${esc(vid)}" ontouchstart="handleCardTap(event, this)">
    <div class="card-head" onclick="toggle(this.closest('.card'))">
      <div>
        <div class="card-name">${esc(s.name)}</div>
        <div class="card-sub">${esc(s.type)}</div>
      </div>
      <div class="badges">
        ${s.must_see ? badge('b-must', '⭐ маст-си') : ''}
        ${s.warning ? badge('b-closed', '⚠️ закрыто') : ''}
        ${priceBadge(s.price)}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-desc">${esc(s.description)}</div>
      ${renderMeta([
        metaRow('🕐', s.hours ? `${esc(s.hours)} ${openBadge(s.hours)}` : ''),
        metaRow('📍', esc(s.address)),
        metaRow('💰', esc(s.price)),
        s.booking_tip ? metaRow('💡', esc(s.booking_tip)) : '',
        s.warning ? `<div class="meta-row"><span class="ic">⚠️</span><span style="color:#fca5a5">${esc(s.warning)}</span></div>` : '',
        s.url ? metaRow('🔗', `<a href="${esc(s.url)}" target="_blank">${esc(s.url.replace(/https?:\/\//, ''))}</a>`) : '',
      ])}
      ${mapsBtn(s.geo)}
      ${story ? renderStorySection(story) : ''}
      <div class="visited-hint">двойной тап = отметить посещённым</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   RESTAURANT CARD
═══════════════════════════════════════════════ */
function renderRestaurant(r, dayIdx) {
  const vid = `r-${dayIdx}-${r.name}`;
  const isV = visited.has(vid);
  const ratingHtml = r.rating ? `<div class="rating">★ ${r.rating}</div>` : '';
  return `
  <div class="card${isV ? ' visited' : ''}" data-breakfast="${r.is_breakfast ? '1' : '0'}" data-vid="${esc(vid)}" ontouchstart="handleCardTap(event, this)">
    <div class="card-head" onclick="toggle(this.closest('.card'))">
      <div>
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-sub">${esc(r.type)}</div>
      </div>
      <div class="badges">
        ${r.is_breakfast ? badge('b-bfast', '☀️ завтрак') : ''}
        ${r.booking ? badge('b-book', '📋 бронь') : ''}
        ${ratingHtml}
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-desc">${esc(r.description)}</div>
      ${renderMeta([
        metaRow('🕐', r.hours ? `${esc(r.hours)} ${openBadge(r.hours)}` : ''),
        metaRow('📍', esc(r.address)),
        metaRow('💰', esc(r.price_range)),
        r.url ? metaRow('🔗', `<a href="${esc(r.url)}" target="_blank">${esc(r.url.replace(/https?:\/\//, ''))}</a>`) : '',
      ])}
      ${mapsBtn(r.geo)}
      <div class="visited-hint">двойной тап = отметить посещённым</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   FILTER
═══════════════════════════════════════════════ */
function filterRestaurants(btn, filter) {
  const panel = btn.closest('.panel');
  panel.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  panel.querySelectorAll('.card[data-breakfast]').forEach(card => {
    if (filter === 'all') card.classList.remove('hidden');
    else if (filter === 'bfast') card.classList.toggle('hidden', card.dataset.breakfast !== '1');
    else card.classList.toggle('hidden', card.dataset.breakfast === '1');
  });
}

/* ═══════════════════════════════════════════════
   SCHEDULE TIMELINE
═══════════════════════════════════════════════ */
function renderSchedule(schedule) {
  if (!schedule?.length) return '';
  return `
  <div class="sec">🕐 Расписание дня</div>
  <div class="info-card" style="padding:14px">
    <div class="timeline">
      ${schedule.map(item => `
        <div class="tl-item">
          <div class="tl-left">
            <div class="tl-time">${esc(item.time)}</div>
            <div class="tl-dot"></div>
            <div class="tl-line"></div>
          </div>
          <div class="tl-event">${esc(item.event)}</div>
        </div>`).join('')}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   DAY PANEL
═══════════════════════════════════════════════ */
function renderDay(day, idx, isToday) {
  const emoji = DAY_EMOJIS[idx] ?? '📍';
  const transportLines = [
    day.transport_in  ? `<div class="transport"><span>🚆</span><span>${esc(day.transport_in)}</span></div>` : '',
    day.transport_mid ? `<div class="transport"><span>🚌</span><span>${esc(day.transport_mid)}</span></div>` : '',
    day.transport_out ? `<div class="transport"><span>🏠</span><span>${esc(day.transport_out)}</span></div>` : '',
    day.transport_tip ? `<div class="transport"><span>💡</span><span>${esc(day.transport_tip)}</span></div>` : '',
  ].filter(Boolean).join('');

  const filterBar = `
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterRestaurants(this,'all')">Все</button>
      <button class="filter-btn" onclick="filterRestaurants(this,'bfast')">☀️ Завтрак</button>
      <button class="filter-btn" onclick="filterRestaurants(this,'dinner')">🌙 Ужин</button>
    </div>`;

  return `
  <div class="day-head">
    <div class="day-head-row">
      <div>
        <div class="day-date">${esc(day.date)}</div>
        <div class="day-city">${emoji} ${esc(day.city)}</div>
        <div class="day-theme">${esc(day.theme)}</div>
      </div>
      <div class="day-badge${isToday ? ' today' : ''}">ДЕНЬ ${day.day}${isToday ? ' · сегодня' : ''}</div>
    </div>
    ${transportLines}
  </div>
  ${renderWarnings(day.day_warnings)}
  ${renderSchedule(day.schedule)}
  <div class="sec">⭐ Достопримечательности</div>
  ${(day.sights ?? []).map(s => renderSight(s, idx)).join('')}
  <div class="sec">🍽️ Рестораны и кафе</div>
  ${filterBar}
  ${(day.restaurants ?? []).map(r => renderRestaurant(r, idx)).join('')}`;
}

/* ═══════════════════════════════════════════════
   PRACTICAL TAB
═══════════════════════════════════════════════ */
function renderPractical(data) {
  const p = data.practical;
  const t = p.transport;
  const calRows = Object.entries(p.calendar ?? {}).map(([k, v]) => {
    const date = k.replace('_may', ' мая').replace('_', ' ');
    return `<div class="info-row"><span class="lbl">${date.trim()}</span><span>${esc(v)}</span></div>`;
  }).join('');

  const transportRows = Object.entries(t).map(([k, v]) => {
    const label = k
      .replace('minsk_to_sula',    'Минск → Сула')
      .replace('minsk_to_grodno',  'Минск → Гродно')
      .replace('grodno_to_brest',  'Гродно → Брест')
      .replace('brest_to_minsk',   'Брест → Минск')
      .replace('minsk_to_moscow',  'Минск → Москва')
      .replace('minsk_to_brest',   'Минск → Брест')
      .replace('brest_to_grodno',  'Брест → Гродно')
      .replace('grodno_to_moscow', 'Гродно → Москва')
      .replace(/_/g, ' → ');
    const val = v.includes('rw.by')
      ? esc(v).replace('rw.by', '<a href="https://rw.by" target="_blank">rw.by</a>')
      : linkifyPhones(v);
    return `<div class="info-row"><span class="lbl">${label}</span><span>${val}</span></div>`;
  }).join('');

  return `
  <div class="info-card">
    <h3>💳 Деньги</h3>
    <div class="info-row"><span class="lbl">Валюта</span><span>${esc(p.currency)}</span></div>
    <div class="info-row"><span class="lbl">Карты</span><span>${esc(p.currency_note)}</span></div>
  </div>
  <div class="info-card">
    <h3>🚆 Транспорт</h3>${transportRows}
  </div>
  <div class="info-card">
    <h3>⚠️ Важные предупреждения</h3>
    ${(p.warnings ?? []).map(w => `<div class="warn-li"><span>⚠️</span><span>${linkifyPhones(w)}</span></div>`).join('')}
  </div>
  <div class="info-card">
    <h3>📅 Даты</h3>${calRows}
  </div>
  <div class="info-card">
    <h3>📝 Заметки</h3>
    ${(data.trip.notes ?? []).map(n => `<div class="note-li">${esc(n)}</div>`).join('')}
  </div>`;
}

/* ═══════════════════════════════════════════════
   ROUTE STRIP
═══════════════════════════════════════════════ */
function renderRoute(days) {
  const cities = days.map(d => d.city.split(' + ')[0].split(' ')[0]);
  return cities.map((c, i) => `
    <div class="route-city"><div class="route-dot"></div><div class="route-name">${esc(c)}</div></div>
    <div class="route-line"></div>
  `).join('') + `
  <div class="route-city"><div class="route-dot end"></div><div class="route-name">🏠 Москва</div></div>`;
}

/* ═══════════════════════════════════════════════
   AUTO-SELECT TODAY
═══════════════════════════════════════════════ */
const RU_MONTHS = { 'января':0,'февраля':1,'марта':2,'апреля':3,'мая':4,'июня':5,'июля':6,'августа':7,'сентября':8,'октября':9,'ноября':10,'декабря':11 };

function findTodayIdx(days) {
  const now = new Date();
  const yr = now.getFullYear();
  for (let i = 0; i < days.length; i++) {
    const m = days[i].date.match(/(\d+)\s+([а-яё]+)/i);
    if (!m) continue;
    const d = parseInt(m[1]);
    const mo = RU_MONTHS[m[2].toLowerCase()];
    if (mo === undefined) continue;
    const tripDate = new Date(yr, mo, d);
    if (tripDate.toDateString() === now.toDateString()) return i;
  }
  return -1;
}

/* ═══════════════════════════════════════════════
   TABS
═══════════════════════════════════════════════ */
function buildTabs(days, todayIdx) {
  return days.map((d, i) => {
    const cityShort = d.city.split(' ')[0];
    const dateShort = d.date.split(',')[0];
    const isToday = i === todayIdx;
    return `<button class="tab${i === (todayIdx >= 0 ? todayIdx : 0) ? ' active' : ''}${isToday ? ' today-tab' : ''}" onclick="showPanel('day${i}', this)">${dateShort} · ${cityShort}${isToday ? ' 📍' : ''}</button>`;
  }).join('') + `<button class="tab info" onclick="showPanel('info', this)">ℹ️ Инфо</button>`;
}

/* ═══════════════════════════════════════════════
   SWIPE
═══════════════════════════════════════════════ */
let swipeX0 = null;
let currentDayIdx = 0;
let totalDays = 0;

function initSwipe(mainEl) {
  mainEl.addEventListener('touchstart', e => {
    swipeX0 = e.touches[0].clientX;
  }, { passive: true });
  mainEl.addEventListener('touchend', e => {
    if (swipeX0 === null) return;
    const dx = e.changedTouches[0].clientX - swipeX0;
    swipeX0 = null;
    if (Math.abs(dx) < 60) return;
    const next = dx < 0 ? currentDayIdx + 1 : currentDayIdx - 1;
    if (next < 0 || next >= totalDays) return;
    const btn = document.querySelector(`.tab:nth-child(${next + 1})`);
    if (btn) showPanel(`day${next}`, btn);
  }, { passive: true });
}

/* ═══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
function render(data) {
  const days = data.days;
  totalDays = days.length;
  const todayIdx = findTodayIdx(days);
  const activeStart = todayIdx >= 0 ? todayIdx : 0;
  currentDayIdx = activeStart;

  const panels = days.map((d, i) => `
    <div id="day${i}" class="panel${i === activeStart ? ' active' : ''}">
      ${renderDay(d, i, i === todayIdx)}
    </div>
  `).join('') + `
  <div id="info" class="panel">${renderPractical(data)}</div>`;

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

  document.getElementById('app').innerHTML = `
  <header class="header">
    <div class="header-top">
      <span style="font-size:26px">🇧🇾</span>
      <div style="flex:1">
        <h1>${esc(data.trip.title)}</h1>
        <p>${esc(data.trip.description)}</p>
      </div>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">${isDark ? '☀️' : '🌙'}</button>
    </div>
    <div class="route-strip">${renderRoute(days)}</div>
    <div class="tabs">${buildTabs(days, todayIdx)}</div>
  </header>
  <main id="main">${panels}</main>
  <footer>${esc(data.trip.dates)}</footer>`;

  initSwipe(document.getElementById('main'));
}

/* ═══════════════════════════════════════════════
   PANEL NAVIGATION
═══════════════════════════════════════════════ */
function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  const dayMatch = id.match(/^day(\d+)$/);
  if (dayMatch) currentDayIdx = parseInt(dayMatch[1]);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggle(card) {
  // Prevent toggle if this was a double-tap for visited
  card.classList.toggle('open');
}

/* ═══════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

Promise.all([
  fetch('data.json').then(r => { if (!r.ok) throw new Error('data.json: ' + r.status); return r.json(); }),
  fetch('stories.json').then(r => { if (!r.ok) throw new Error('stories.json: ' + r.status); return r.json(); }),
])
  .then(([data, stories]) => {
    storiesMap = {};
    (stories.places ?? []).forEach(p => {
      if (p.geo) storiesMap[geoKey(p.geo)] = p;
    });
    render(data);
  })
  .catch(e => {
    document.getElementById('app').innerHTML =
      `<div class="loading" style="flex-direction:column;gap:8px">
        <span style="font-size:32px">⚠️</span>
        <span>Не удалось загрузить data.json</span>
        <span style="font-size:12px;color:var(--text2)">${String(e.message)}</span>
      </div>`;
  });
</script>
</body>
